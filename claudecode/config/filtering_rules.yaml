# Default filtering rules for security findings
# This file can be overridden by providing a custom file via:
#   - false-positive-filtering-instructions input in action.yml
#   - FALSE_POSITIVE_FILTERING_INSTRUCTIONS env var

# Hard exclusions - Findings matching these patterns are automatically excluded
# These represent categories that are typically false positives or low-signal
hard_exclusions:
  - name: denial_of_service
    description: "Denial of Service (DOS) vulnerabilities or resource exhaustion attacks"
    reason: "DoS concerns are typically operational rather than security issues"

  - name: disk_secrets
    description: "Secrets/credentials stored on disk"
    reason: "These are managed separately by secret scanning tools"

  - name: rate_limiting
    description: "Rate limiting concerns or service overload scenarios"
    reason: "Services don't need to implement rate limiting at code level"

  - name: resource_exhaustion
    description: "Memory consumption or CPU exhaustion issues"
    reason: "Resource management is an operational concern"

  - name: input_validation_minor
    description: "Lack of input validation on non-security-critical fields without proven security impact"
    reason: "Not all fields require strict validation"

  - name: github_action_sanitization
    description: "Input sanitization concerns for GitHub Action workflows"
    reason: "Actions have limited attack surface"

  - name: hardening
    description: "Lack of hardening measures"
    reason: "Code is not expected to implement all security best practices"

  - name: theoretical_race_conditions
    description: "Race conditions or timing attacks that are theoretical"
    reason: "Only report race conditions with clear exploit paths"

  - name: outdated_dependencies
    description: "Vulnerabilities related to outdated third-party libraries"
    reason: "Managed separately by dependency scanning tools"

  - name: rust_memory_safety
    description: "Memory safety issues in Rust code"
    reason: "Rust's type system prevents these issues"

  - name: test_files
    description: "Files that are only unit tests or test utilities"
    reason: "Test code does not run in production"

  - name: log_spoofing
    description: "Log spoofing or log injection concerns"
    reason: "Unsanitized log output is not a vulnerability"

  - name: ssrf_path_only
    description: "SSRF vulnerabilities that only control the path"
    reason: "SSRF requires control of host or protocol"

  - name: ai_prompt_injection
    description: "User-controlled content in AI system prompts"
    reason: "User input in AI prompts is expected behavior"

  - name: internal_dependencies
    description: "Dependencies on internal/private libraries"
    reason: "Internal dependencies are not a security issue"

  - name: crash_bugs
    description: "Issues that cause crashes but aren't vulnerabilities"
    reason: "Undefined variables or null references aren't security issues"

# Signal quality criteria - Used to assess remaining findings
signal_criteria:
  - "Is there a concrete, exploitable vulnerability with a clear attack path?"
  - "Does this represent a real security risk vs theoretical best practice?"
  - "Are there specific code locations and reproduction steps?"
  - "Would this finding be actionable for a security team?"

# Precedents - Specific rules for common finding types
precedents:
  - category: logging
    rule: "Logging high value secrets in plaintext is a vulnerability. Otherwise, do not report theoretical secret exposures. Logging URLs is safe. Logging request headers is dangerous (may contain credentials)."

  - category: uuid
    rule: "UUIDs can be assumed unguessable. Vulnerabilities requiring UUID guessing are invalid."

  - category: audit_logs
    rule: "Missing or modified audit logs are not critical security issues."

  - category: environment_variables
    rule: "Environment variables and CLI flags are trusted values. Attacks requiring env var control are invalid."

  - category: resource_leaks
    rule: "Memory or file descriptor leaks are not valid security findings."

  - category: web_vulnerabilities
    rule: "Subtle web vulnerabilities (tabnabbing, XS-Leaks, prototype pollution, open redirects) are not valid."

  - category: react_xss
    rule: "React is secure against XSS unless using dangerouslySetInnerHTML. Don't report XSS in React/TSX without unsafe methods."

  - category: github_actions
    rule: "Most GitHub Action workflow vulnerabilities are not exploitable. Require concrete attack paths."

  - category: client_side_auth
    rule: "Lack of permission checking in client-side TS is not a vulnerability. Server handles auth."

  - category: medium_findings
    rule: "Only include MEDIUM findings if they are obvious and concrete."

  - category: notebooks
    rule: "Most IPython notebook vulnerabilities are not exploitable. Require concrete attack paths."

  - category: non_pii_logging
    rule: "Logging non-PII data is not a vulnerability, even if sensitive. Only report PII/secret logging."

  - category: shell_injection
    rule: "Command injection in shell scripts is rarely exploitable. Require concrete untrusted input paths."

  - category: client_ssrf
    rule: "SSRF in client-side JS/TS is not valid. Only report SSRF in server-side code. Same for path traversal."

  - category: http_path_traversal
    rule: "Path traversal using ../ in HTTP requests is generally not an issue. Only relevant for file reads."

  - category: log_injection
    rule: "Injecting into log queries is generally not an issue unless it definitely exposes sensitive data."

# Confidence scoring
confidence_levels:
  low:
    range: [1, 3]
    description: "Likely false positive or noise"
  medium:
    range: [4, 6]
    description: "Needs investigation"
  high:
    range: [7, 10]
    description: "Likely true vulnerability"
