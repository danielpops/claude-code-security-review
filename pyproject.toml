[project]
name = "claudecode"
version = "1.0.0"
description = "AI-Powered PR Security Audit Tool using Claude Code"
authors = [{name = "Anthropic Security Team"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "PyGithub>=1.59.0",
    "requests>=2.28.0",
    "anthropic>=0.39.0",
    "PyYAML>=6.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "PyJWT>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "types-requests>=2.28.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
claudecode = "claudecode.github_action_audit:main"
claudecode-webhook = "claudecode.webhook.__main__:main"

# Poetry configuration (for poetry users)
[tool.poetry]
name = "claudecode"
version = "1.0.0"
description = "AI-Powered PR Security Audit Tool using Claude Code"
authors = ["Anthropic Security Team"]
readme = "README.md"
license = "MIT"
packages = [{include = "claudecode"}]

[tool.poetry.dependencies]
python = "^3.10"
PyGithub = ">=1.59.0"
requests = ">=2.28.0"
anthropic = ">=0.39.0"
PyYAML = ">=6.0.0"
fastapi = ">=0.109.0"
uvicorn = ">=0.27.0"
PyJWT = ">=2.8.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-asyncio = ">=0.21.0"
httpx = ">=0.25.0"
mypy = ">=1.0.0"
ruff = ">=0.1.0"
types-requests = ">=2.28.0"
types-PyYAML = ">=6.0.0"

[tool.poetry.scripts]
claudecode = "claudecode.github_action_audit:main"
claudecode-webhook = "claudecode.webhook.__main__:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["claudecode"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["claudecode"]
